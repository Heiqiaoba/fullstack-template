# 持续集成：push/PR 到 main 时运行
# 两个 job：quality（检查/测试/构建/契约校验）→ docker（镜像构建）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 的新提交会取消旧的进行中运行，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门禁：代码规范 → 类型 → 测试 → 契约一致性 → 构建 → 依赖审计
  quality:
    runs-on: ubuntu-latest
    services:
      # 测试用 PostgreSQL：health 确保数据库就绪后再跑测试
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      # 拉取代码
      - uses: actions/checkout@v4
      # 固定 pnpm 版本，与 packageManager 一致
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      # Node 22 + 基于 pnpm lockfile 缓存依赖
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 严格按 lockfile 安装，保证可复现
      - run: pnpm install --frozen-lockfile
      # Biome 代码规范检查
      - name: Lint
        run: pnpm lint
      # 全量 TypeScript 类型检查
      - name: Typecheck
        run: pnpm typecheck
      # 单元测试 + 集成测试（覆盖率开启）
      - name: Test
        run: pnpm test
        env:
          COVERAGE: 'true'
      # 契约守护：重新生成 OpenAPI/前端类型后必须无 diff，
      # 防止改了 shared schema 却忘记提交生成物
      - name: API contract (regenerate must be clean)
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/shared/openapi.json apps/web/src/api/generated.d.ts
      # 全量构建（含 shared / server / web）
      - name: Build
        run: pnpm build
      # 生产依赖高危漏洞审计；当前版本仅告警不阻断，可按需移除 continue-on-error
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # 镜像构建：质量门禁通过后才验证两个 Dockerfile 可正常出包
  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # 后端镜像（builder + runtime 多阶段）
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t template-server .
      # 前端镜像（builder + nginx runtime 多阶段）
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t template-web .
