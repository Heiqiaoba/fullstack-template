# 前端站点的 Nginx 配置：静态资源由 Nginx 直接托管，/api 反向代理到 server 容器
server {
  listen 80;
  server_name _;
  # Vite 构建产物挂载点（见 apps/web/Dockerfile）
  root /usr/share/nginx/html;
  index index.html;

  # 静态资源缓存：带 hash 的 /assets/* 可长期缓存（public, immutable）
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API 反向代理：server 是 compose 服务名，容器内 3000 端口；
  # 转发 Host/真实 IP/协议/Cookie，保证会话 Cookie 与限流取 IP 正确
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
  }

  # SPA history fallback：非静态/API 请求统一回 index.html，交给前端路由处理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
